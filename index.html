<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rmgr-viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #16181f;
        --panel-border: #262a35;
        --text: #e6e8ee;
        --text-dim: #8b8f9c;
        --accent: #4f7fdb;
      }
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        /* The page itself never scrolls - header and footer are fixed-height
         flex items, #main is the only flexible one, and its own children
         (#stageWrap, #players) each handle their own overflow. Without this,
         content that doesn't fit just grows the page past the viewport
         instead of the canvas/panels shrinking to fit - which is exactly
         what was cutting off the transport bar at smaller window sizes. */
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--panel-border);
        background: var(--panel);
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        color: var(--text-dim);
        white-space: nowrap;
      }
      #fileInfo {
        font-size: 13px;
        color: var(--text-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      #filePicker {
        font-size: 12px;
        color: var(--text-dim);
      }
      main {
        flex: 1;
        display: flex;
        gap: 12px;
        padding: 12px;
        min-height: 0;
        min-width: 0;
      }
      #stageWrap {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        overflow: hidden;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }
      #sidebar {
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #players {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #matchStats,
      #eventLog {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        overflow: hidden;
      }
      #matchStatsHeader,
      #eventLogHeader {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--panel-border);
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      #statsCollapseBtn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        color: var(--text-dim);
      }
      #statsCollapseBtn:hover {
        color: var(--text);
      }
      .collapse-icon {
        font-size: 8px;
        transition: transform 0.15s ease;
      }
      #statsCollapseBtn.collapsed .collapse-icon {
        transform: rotate(-90deg);
      }
      #matchStatsHeader h2,
      #eventLogHeader h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0;
        flex-shrink: 0;
      }
      #statsCollapseBtn:hover h2 {
        color: var(--text);
      }
      #perspectiveToggle {
        display: flex;
        gap: 4px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .perspective-btn {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid transparent;
        cursor: pointer;
        background: transparent;
        color: var(--text-dim);
        opacity: 0.55;
        transition: opacity 0.1s;
      }
      .perspective-btn.active {
        opacity: 1;
        border-color: currentColor;
        background: rgba(255, 255, 255, 0.06);
      }
      #statsPanel {
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
      }
      #statsPanel[hidden] {
        display: none !important;
      }
      #statsEmpty {
        font-size: 12px;
        color: var(--text-dim);
        margin: 0;
      }
      .stat-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .stat-row-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-dim);
      }
      .stat-row-value {
        font-variant-numeric: tabular-nums;
        color: var(--text);
        font-size: 13px;
      }
      .stat-pct {
        font-weight: 700;
        font-size: 15px;
      }
      .stat-pct.pct-success {
        color: #4fbf6a;
      }
      .stat-pct.pct-failure {
        color: #e0473f;
      }
      #eventLogList {
        overflow-y: auto;
        max-height: 240px;
        padding: 4px 0;
      }
      #eventLogEmpty {
        font-size: 12px;
        color: var(--text-dim);
        padding: 10px 12px;
        margin: 0;
      }
      .event-log-entry {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        padding: 4px 12px;
        color: var(--text-dim);
        border-left: 3px solid transparent;
        cursor: default;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .event-log-entry.is-current {
        color: var(--text);
        background: rgba(79, 127, 219, 0.12);
        border-left-color: var(--accent);
      }
      .event-log-entry.kind-entered {
        color: var(--text-dim);
      }
      .event-log-entry.kind-neutral-hit {
        color: var(--text-dim);
      }
      .event-log-entry.kind-success {
        color: #4fbf6a;
      }
      .event-log-entry.kind-failure {
        color: #e0473f;
      }
      .event-log-entry.is-current.kind-neutral-hit {
        background: rgba(139, 143, 156, 0.14);
        border-left-color: var(--text-dim);
      }
      .event-log-entry.is-current.kind-success {
        background: rgba(79, 191, 106, 0.12);
        border-left-color: #4fbf6a;
      }
      .event-log-entry.is-current.kind-failure {
        background: rgba(224, 71, 63, 0.12);
        border-left-color: #e0473f;
      }
      footer {
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      /* Narrow windows: stack the player panels below the stage instead of
       squeezing them into a fixed 320px column beside it. */
      @media (max-width: 860px) {
        main {
          flex-direction: column;
        }
        #sidebar {
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          max-height: 45%;
        }
        #players {
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
        }
        #eventLog {
          width: 100%;
        }
        .player-panel {
          flex: 1 1 260px;
        }
      }
      .player-panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-left: 4px solid var(--player-color, var(--accent));
        border-radius: 8px;
        padding: 10px 12px;
      }
      .player-name {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 6px;
        color: var(--player-color, var(--text));
      }
      .player-name .character {
        font-weight: 400;
        color: var(--text-dim);
        font-size: 12px;
      }
      .player-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 10px;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 8px;
      }
      .player-stats strong {
        color: var(--text);
        font-weight: 600;
      }
      .player-stats .full-row {
        grid-column: 1 / -1;
      }
      .stat-combo-hits.in-combo {
        color: #ff9f43;
      }
      canvas.controller-pad {
        display: block;
        border-radius: 6px;
        width: 100%;
        height: auto;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-top: 1px solid var(--panel-border);
        background: var(--panel);
      }
      footer button {
        background: #22252f;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 14px;
        cursor: pointer;
      }
      footer button:hover {
        background: #2c3040;
      }
      footer button:active {
        background: var(--accent);
      }
      #scrubber {
        flex: 1;
        accent-color: var(--accent);
      }
      #frameLabel {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--text-dim);
        white-space: nowrap;
        min-width: 220px;
        text-align: right;
      }
      #loadStatus {
        font-size: 12px;
        color: #e0473f;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>rmgr-viewer</h1>
      <input type="file" id="filePicker" accept=".rmgr" />
      <span id="fileInfo"></span>
      <span id="loadStatus"></span>
    </header>
    <main>
      <div id="stageWrap">
        <canvas id="stage" width="960" height="540"></canvas>
      </div>
      <aside id="sidebar">
        <div id="players"></div>
        <section id="matchStats">
          <div id="matchStatsHeader">
            <button id="statsCollapseBtn" title="Collapse / expand Match Stats">
              <span class="collapse-icon">▼</span>
              <h2>Match Stats</h2>
            </button>
            <div id="perspectiveToggle"></div>
          </div>
          <div id="statsPanel">
            <p id="statsEmpty">No stats — load a Dream Land 2-player replay.</p>
          </div>
        </section>
        <section id="eventLog">
          <div id="eventLogHeader">
            <h2>Event Log</h2>
          </div>
          <div id="eventLogList">
            <p id="eventLogEmpty">No events yet.</p>
          </div>
        </section>
      </aside>
    </main>
    <footer>
      <button id="stepBack" title="Previous frame">⏮</button>
      <button id="playPause" title="Play/Pause">▶</button>
      <button id="stepForward" title="Next frame">⏭</button>
      <input type="range" id="scrubber" min="0" max="0" value="0" />
      <span id="frameLabel"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
