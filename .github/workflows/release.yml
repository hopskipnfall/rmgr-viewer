name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmgr-viewer
      - uses: actions/checkout@v4
        with:
          repository: hopskipnfall/rmgr-ts
          path: rmgr-ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: rmgr-ts
      - run: npm run build
        working-directory: rmgr-ts

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
        working-directory: rmgr-viewer

      # Unsigned: see README "Desktop app" for first-launch steps.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: rmgr-viewer
          tagName: ${{ github.ref_name }}
          releaseName: RMGR Viewer ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
